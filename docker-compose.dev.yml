# 本地开发覆盖文件：与 docker-compose.yml 一起使用
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# - backend: 挂载源码 + 测试文件，uvicorn 热重载（DEV_MODE）
# - frontend: 挂载 src，跑 vite dev server（对外端口 5173，改前端代码即时生效）
# 生产部署请只使用 docker-compose.yml（无源码挂载、nginx 托管静态产物）。

services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini:ro
      # ruff 的配置与验收脚本也要挂进来，否则容器里的 `ruff check .` 看不到它们
      # （scripts 本来只在镜像里有一份，改完脚本不重建镜像是不会生效的）
      - ./backend/scripts:/app/scripts
      - ./backend/ruff.toml:/app/ruff.toml:ro
    environment:
      - DEV_MODE=1
      # /app 是宿主挂进来的 bind mount（宿主 uid 拥有），容器里的 appuser 写不进去，
      # 所以 ruff 默认的 /app/.ruff_cache 会 permission denied——把缓存挪到 /tmp。
      # （同一个原因也让 pytest 每次报一句 PytestCacheWarning，那个还没动。）
      - RUFF_CACHE_DIR=/tmp/.ruff_cache

  frontend:
    build:
      context: ./frontend
      target: dev
    # `!override` 是必需的，不是洁癖：compose 对 ports 是**叠加**不是替换。
    # 少了它，base 的 "5173:8080"(nginx) 和这里的映射会同时生效，
    # 宿主机上留下两个入口 —— 而且 5173 上那个还指着已经不再运行的 nginx，
    # 表现就是"页面能开但接口全挂"。
    # 端口沿用 5173，访问地址不变，只是从"静态产物"换成"vite dev server"。
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_PROXY=http://backend:8000