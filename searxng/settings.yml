# SearXNG configuration for AiStoryCAD
# See https://docs.searxng.org/admin/settings/settings.yml.html

use_default_settings: true
general:
  instance_name: "AiStoryCAD Search"
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  # 从环境变量读取（docker-compose 从 .env 的 SEARXNG_SECRET_KEY 传入）。
  # 占位值仅用于开发环境，生产必须设置随机密钥。
  secret_key: "${SEARXNG_SECRET_KEY:-storycad-dev-only-secret-key-change-me}"
  # 开启限流:否则后端的 web_search 可经共享实例无限量发起上游搜索请求。
  limiter: true
  image_proxy: false
  # Bind to all interfaces inside Docker
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_theme: simple
  default_locale: zh-Hans-CN

# Pre-configure the most reliable search engines
engines:
  # Google (needs to be enabled explicitly)
  - name: google
    engine: google
    shortcut: g
    disabled: false

  # Bing
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  # DuckDuckGo
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  # Brave
  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  # Wikipedia
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  # If AiStoryCAD has a proxy configured, SearXNG will respect HTTP_PROXY/HTTPS_PROXY env vars
  # proxies:
  #   all://:
  #     - http://proxy:port
